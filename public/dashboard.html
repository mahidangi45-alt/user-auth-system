
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureAuth | Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <div class="logo">S</div>
      <h1>Welcome to SecureAuth!</h1>
      <p class="subtitle">You are signed in.</p>

      <h2 id="user-name">Loading your profile...</h2>
      <p id="user-email"></p>
      <p id="dashboard-message" role="status"></p>

      <button type="button" id="logout-button" class="submit-btn">
        Logout
      </button>
    </section>
  </main>
</body>
</html>
